name: Deploy por FTP (hospedagem oficial)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FTP_SERVER: ${{ secrets.FTP_SERVER }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checar segredos
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Segredos de FTP não configurados; pulando deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        id: check
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - run: npm run build
        if: steps.check.outputs.skip != 'true'
      - name: Enviar dist/ para o servidor
        if: steps.check.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
